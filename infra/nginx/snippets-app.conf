# Rotas comuns aos modos HTTP e HTTPS (incluído dentro de um bloco server).
client_max_body_size 5m;
server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location ~ ^/api/v1/auth/(profissional/login|aluno/login|mfa/) {
    limit_req zone=login burst=100 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
}

# Upload de mídia das questões: até 5 MB de arquivo + cabeçalhos do multipart (ADR-0032).
location = /api/v1/midias {
    client_max_body_size 6m;
    include /etc/nginx/snippets/proxy-api.conf;
}

# Notificações em tempo real (SSE — ADR-0050): sem buffer, para o evento chegar na hora.
location = /api/v1/notificacoes/fluxo {
    proxy_buffering off;
    proxy_cache off;
    include /etc/nginx/snippets/proxy-api.conf;
}

# Métricas internas (ADR-0054): só o monitor lê, direto em api:3000. Regex sem diferenciar
# maiúsculas porque o roteamento do Express também não diferencia.
location ~* ^/api/v1/health/metricas {
    return 404;
}

location /api/ {
    include /etc/nginx/snippets/proxy-api.conf;
}

# Assets com hash no nome: cache longo e imutável.
location /assets/ {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# SPA: qualquer rota desconhecida devolve o index.html (sem cache).
location / {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
