# Cabeçalhos de segurança para o SPA (incluído em cada location que serve HTML/estáticos).
add_header Strict-Transport-Security $cabecalho_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# QR code do MFA vem como data: URI; sem scripts/estilos de terceiros.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
